plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

configurations {
    jflex
    beaverCompiler
    jastaddCompiler
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation libs.guava

    // JFlex
    jflex 'de.jflex:jflex:1.9.1'

    // Beaver
    beaverCompiler 'net.sf.beaver:beaver-cc:0.9.11'
    implementation 'net.sf.beaver:beaver-rt:0.9.11'

    // JastAdd
    jastaddCompiler 'org.jastadd:jastadd:2.4.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'de.networkplan.App'
}

// The 'run' task defaults its working directory to this subproject (app/),
// so a relative --args path like "examples/x.network" would resolve to
// app/examples/x.network instead of the repo-root examples/ directory.
tasks.named('run', JavaExec) {
    workingDir = rootProject.projectDir
}

tasks.named('test') {
    useJUnitPlatform()
}

// Generated source directories, populated by the tasks below.
def generatedLexerDir = layout.buildDirectory.dir('generated/sources/jflex/main')
def generatedParserDir = layout.buildDirectory.dir('generated/sources/beaver/main')
def generatedAstDir = layout.buildDirectory.dir('generated/sources/jastadd/main')

def networkFlex = file('src/main/jflex/Network.flex')
def networkGrammar = file('src/main/beaver/Network.grammar')

def jastaddSources = files(
    'src/main/jastadd/NetworkPlan.ast',
    'src/main/jastadd/NameAnalysis.jrag',
    'src/main/jastadd/SemanticAnalysis.jrag',
    'src/main/jastadd/GraphAnalysis.jrag',
    'src/main/jastadd/CpmAnalysis.jrag'
)

// JFlex generates the lexer from the token specification. Unlike Beaver and
// JastAdd, JFlex writes its output flat into -d instead of nesting it under
// the declared package, so -d must already point at the package directory.
def generatedLexerPackageDir = generatedLexerDir.get().dir('de/networkplan/lexer').asFile

tasks.register('generateLexer', JavaExec) {
    group = 'build'
    description = 'Generates the lexer from the JFlex specification.'

    classpath = configurations.jflex
    mainClass = 'jflex.Main'

    args '--encoding', 'UTF-8', '-d', generatedLexerPackageDir.absolutePath, networkFlex.absolutePath

    inputs.file(networkFlex)
    outputs.dir(generatedLexerDir)
}

// Beaver generates the parser from the grammar file.
tasks.register('generateParser', JavaExec) {
    group = 'build'
    description = 'Generates the parser from the Beaver grammar.'

    classpath = configurations.beaverCompiler
    mainClass = 'beaver.comp.run.Make'

    args '-d', generatedParserDir.get().asFile.absolutePath, networkGrammar.absolutePath

    inputs.file(networkGrammar)
    outputs.dir(generatedParserDir)
}

// JastAdd generates the AST.
tasks.register('generateAst', JavaExec) {
    group = 'build'
    description = 'Generates the JastAdd AST classes.'

    classpath = configurations.jastaddCompiler
    mainClass = 'org.jastadd.JastAdd'

    args(*([
        '--package=de.networkplan.ast',
        "--o=${generatedAstDir.get().asFile.absolutePath}",
        '--beaver',
        '--safeLazy',
        '--lineColumnNumbers',
        // Renamed from JastAdd's default 'List' so java.util.List can be
        // imported normally in .jrag files instead of always fully qualified.
        '--List=PlanList'
    ] + jastaddSources.collect { it.absolutePath }))

    inputs.files(jastaddSources)
    outputs.dir(generatedAstDir)
}

// The three tasks above write here, connect their output as Java sources.
sourceSets {
    main {
        java {
            srcDir generatedLexerDir
            srcDir generatedParserDir
            srcDir generatedAstDir
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateLexer')
    dependsOn tasks.named('generateParser')
    dependsOn tasks.named('generateAst')
}

// Benchmarks live in src/jmh/java. Gradle compiles that folder on its own,
// separately from the app and from the tests, because the name 'jmh' below
// matches the folder name. They do NOT run during a normal build or on CI,
// because a full run takes over an hour. PerformanceRegressionTest is the
// quick check that does run on every build.
sourceSets {
    jmh {
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

// These two lines need their own block down here, and cannot be moved into
// the main dependencies block near the top of the file. The name
// 'jmhImplementation' is created by the sourceSets block just above, so higher
// up the file it does not exist yet - the same problem as trying to use a
// variable before declaring it.
dependencies {
    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

// ./gradlew :app:benchmark           full run, every size and topology (heavy)
// ./gradlew :app:benchmark -Pquick   smoke run, one size and topology (quick)
tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Runs CPM runtime and allocation benchmarks.'

    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'

    def quick = providers.gradleProperty('quick').isPresent()

    // A quick run writes its own file, so that a rough run can never overwrite
    // the results of a full one, which takes over an hour to produce.
    def resultsName = quick ? 'results-quick.json' : 'results.json'
    def resultsFile = layout.buildDirectory.file("reports/jmh/$resultsName").get().asFile

    args '-f', '1'                          // use 1 brand new JVM per benchmark, so that an
                                            // earlier benchmark cannot make a later one look fast
    args '-prof', 'gc'                      // also measure memory: bytes allocated per call
    args '-rf', 'json'                      // write the results as JSON...
    args '-rff', resultsFile.absolutePath   // ...into this file
    args '-wi', quick ? '1' : '3'           // practice rounds, results thrown away. Java code
                                            // starts slow and speeds up as it keeps running, so
                                            // we let it reach full speed before measuring
    args '-i', quick ? '1' : '5'            // real rounds, these are the numbers we report
    if (quick) {
        // Still every size and every shape, otherwise there is no curve to draw,
        // just far shorter rounds: 2 seconds each instead of the default 10.
        args '-r', '2'
    }

    doFirst {
        resultsFile.parentFile.mkdirs()
    }
}
